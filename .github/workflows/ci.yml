name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    # "ubuntu-latest" punta ora a Ubuntu 26.04, non ancora supportata da
    # "playwright install --with-deps": si fissa una LTS supportata.
    runs-on: ubuntu-24.04
    # Il backend (libs/database) si connette a Postgres su localhost:5432
    # con queste credenziali hardcoded: serve per far girare gli e2e in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: PrenAppelli
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Necessario perché @org/ui-e2e (Playwright) lancia browser reali.
      - run: npx playwright install --with-deps

      # nx.json ha "neverConnectToCloud": true, quindi niente distribuzione/
      # atomizzazione su Nx Cloud: si esegue tutto localmente al runner.
      - run: npx nx format:check --base="remotes/origin/main"
      - run: npx nx run-many -t lint test build typecheck e2e
